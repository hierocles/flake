# Recyclarr 8.x uses the config-templates *v8* branch — no `include: - template:`.
# https://recyclarr.dev/guide/upgrade-guide/v8.0/#official-include-templates-removed
#
# Template sources:
# - https://github.com/recyclarr/config-templates/blob/v8/radarr/templates/sqp/sqp-1-web-2160p.yml
# - https://github.com/recyclarr/config-templates/blob/v8/radarr/templates/sqp/sqp-1-web-1080p.yml
# - https://github.com/recyclarr/config-templates/blob/v8/sonarr/templates/web-2160p.yml
# - https://github.com/recyclarr/config-templates/blob/v8/sonarr/templates/web-1080p.yml
#
# CF groups: https://recyclarr.dev/reference/configuration/custom-formats/#custom_format_groups

radarr:
  sqp-1-web:
    base_url: http://localhost:7878
    api_key: !env_var RADARR_API_KEY
    media_naming:
      folder: plex-tmdb
      movie:
        rename: true
        standard: plex-tmdb

    quality_definition:
      type: sqp-streaming

    quality_profiles:
      - trash_id: e91c9adaca0231493f4af0d571b907f9 # [SQP] SQP-1 WEB (2160p)
        name: SQP-1 WEB (2160p)
        reset_unmatched_scores:
          enabled: true
      - trash_id: 90a3370d2d30cbaf08d9c23b856a12c8 # [SQP] SQP-1 WEB (1080p)
        name: SQP-1 WEB (1080p)
        reset_unmatched_scores:
          enabled: true

    custom_format_groups:
      add:
        - trash_id: 15b1cf0b6f1a1493856a4355907affee # [Unwanted] Unwanted Formats SQP
          assign_scores_to:
            - name: SQP-1 WEB (2160p)
            - name: SQP-1 WEB (1080p)
          select:
            - b6832f586342ef70d9c128d40c07b872 # Bad Dual Groups
            - ae9b7c9ebde1f3bd336a8cbd1ec4c5e5 # No-RlsGroup
            - 7357cf5161efbf8c4d5d0c30b4815ee2 # Obfuscated
            - 5c44f52a8714fdd79bb4d98e2673be1f # Retags
            - f537cf427b64c38c8e36298f657e4828 # Scene
        - trash_id: f4f1474b963b24cf983455743aa9906c # [Optional] Movie Versions
          assign_scores_to:
            - name: SQP-1 WEB (2160p)
            - name: SQP-1 WEB (1080p)
          select:
            - 570bc9ebecd92723d2d21500f4be314c # Remaster
        - trash_id: b29413a7487478fe98228ce79e5689e4 # [HDR Formats] HDR10+ Boost
          assign_scores_to:
            - name: SQP-1 WEB (2160p)
            - name: SQP-1 WEB (1080p)
        - trash_id: 7fc2751eef7e6bdc70b74136e5e35c76 # [HDR Formats] DV (w/o HDR fallback)
          assign_scores_to:
            - name: SQP-1 WEB (2160p)
            - name: SQP-1 WEB (1080p)
      # [HDR Formats] HDR (ef20e67b…) syncs by default for compatible SQP profiles; uncomment to opt out:
      # skip:
      #   - ef20e67b95a381fb3bc6d1f06ea24f46 # [HDR Formats] HDR

sonarr:
  web-v4:
    base_url: http://localhost:8989
    api_key: !env_var SONARR_API_KEY
    media_naming:
      series: plex-tvdb
      season: default
      episodes:
        rename: true
        standard: default
        daily: default
        anime: default

    quality_definition:
      type: series

    quality_profiles:
      - trash_id: d1498e7d189fbe6c7110ceaabb7473e6 # WEB-2160p
        name: WEB-2160p
        reset_unmatched_scores:
          enabled: true
      - trash_id: 72dae194fc92bf828f32cde7744e51a1 # WEB-1080p
        name: WEB-1080p
        reset_unmatched_scores:
          enabled: true

    custom_format_groups:
      add:
        - trash_id: e3f37512790f00d0e89e54fe5e790d1c # [Optional] Golden Rule UHD
          assign_scores_to:
            - name: WEB-2160p
          select:
            - 9b64dff695c2115facf1b6ea59c9bd07 # x265 (no HDR/DV)
        - trash_id: 158188097a58d7687dee647e04af0da3 # [Optional] Golden Rule HD
          assign_scores_to:
            - name: WEB-1080p
          select:
            - 47435ece6b99a0b477caf360e79ba0bb # x265 (HD)
        - trash_id: 85fae4a2294965b75710ef2989c850eb # [Streaming Services] HD/UHD boost
          assign_scores_to:
            - name: WEB-2160p
            - name: WEB-1080p
        - trash_id: 59c3af66780d08332fdc64e68297098f # [Unwanted] Unwanted Formats
          assign_scores_to:
            - name: WEB-2160p
            - name: WEB-1080p
          select:
            - 32b367365729d530ca1c124a0b180c64 # Bad Dual Groups
            - 82d40da2bc6923f41e14394075dd4b03 # No-RlsGroup
            - e1a997ddb54e3ecbfe06341ad323c458 # Obfuscated
            - 06d66ab109d4d2eddb2794d21526d140 # Retags
            - 1b3994c551cbb92a2c781af061f4ab44 # Scene
        - trash_id: 7d366c213e5c23a052b157356fac1921 # [HDR Formats] HDR10+ Boost
          assign_scores_to:
            - name: WEB-2160p
            - name: WEB-1080p
        - trash_id: d776a1ea912a117d66d83b880ff2055d # [HDR Formats] DV (w/o HDR fallback)
          assign_scores_to:
            - name: WEB-2160p
            - name: WEB-1080p
      # [HDR Formats] HDR (7e1724c5…) syncs by default for WEB profiles:
      # skip:
      #   - 7e1724c5da59e7474803ad25be98f6a3 # [HDR Formats] HDR
